<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive Video Player</title>

    <style>
        body{
            font-family:Arial,Helvetica,sans-serif;
            background:#f4f4f4;
            padding:30px;
            text-align:center;
        }

        input{
            width:70%;
            max-width:700px;
            padding:12px;
            font-size:16px;
            border:1px solid #ccc;
            border-radius:6px;
        }

        button{
            padding:12px 20px;
            margin-left:10px;
            font-size:16px;
            cursor:pointer;
            border:none;
            background:#2563eb;
            color:#fff;
            border-radius:6px;
        }

        button:hover{
            background:#1d4ed8;
        }

        .player{
            margin-top:30px;
            width:90%;
            max-width:900px;
            aspect-ratio:16/9;
            margin-left:auto;
            margin-right:auto;
        }

        iframe{
            width:100%;
            height:100%;
            border:none;
            border-radius:10px;
        }

        .message{
            margin-top:15px;
            color:red;
        }
    </style>
</head>
<body>

<h2>Google Drive Video Player</h2>

<input
    type="text"
    id="driveLink"
    placeholder="Paste Google Drive Video Link Here">

<button onclick="loadVideo()">Load Video</button>

<div class="message" id="message"></div>

<div class="player">
    <iframe
        id="videoFrame"
        allow="autoplay"
        allowfullscreen>
    </iframe>
</div>

<script>

function extractFileId(url){

    const patterns = [
        /\/file\/d\/([a-zA-Z0-9_-]+)/,
        /id=([a-zA-Z0-9_-]+)/,
        /\/d\/([a-zA-Z0-9_-]+)/
    ];

    for(const pattern of patterns){
        const match = url.match(pattern);
        if(match){
            return match[1];
        }
    }

    return null;
}

function loadVideo(){

    const input = document.getElementById("driveLink").value.trim();
    const message = document.getElementById("message");
    const frame = document.getElementById("videoFrame");

    message.textContent = "";

    const fileId = extractFileId(input);

    if(!fileId){
        message.textContent = "Invalid Google Drive link.";
        return;
    }

    frame.src = `https://drive.google.com/file/d/${fileId}/preview`;
}

// Example video on page load
document.getElementById("driveLink").value =
"https://drive.google.com/file/d/1yOMusFqAcjweEMx73XO5E4KScLzrzoBT/view?usp=sharing";

loadVideo();

</script>

</body>
</html>
