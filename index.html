```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Video Player</title>

    <style>
        body{
            font-family:Arial,Helvetica,sans-serif;
            background:#f4f4f4;
            padding:30px;
            text-align:center;
        }

        input{
            width:70%;
            max-width:700px;
            padding:12px;
            font-size:16px;
            border:1px solid #ccc;
            border-radius:6px;
            background:#fff;
        }

        button{
            padding:12px 20px;
            margin-left:10px;
            font-size:16px;
            cursor:pointer;
            border:none;
            background:#2563eb;
            color:#fff;
            border-radius:6px;
        }

        button:hover{
            background:#1d4ed8;
        }

        .player{
            margin-top:30px;
            width:90%;
            max-width:900px;
            aspect-ratio:16/9;
            margin-left:auto;
            margin-right:auto;
            background:#000;
            border-radius:10px;
            overflow:hidden;
        }

        video{
            width:100%;
            height:100%;
            display:block;
            background:#000;
            object-fit:contain;
        }

        .message{
            margin-top:15px;
            color:red;
        }

        .file-name{
            margin-top:10px;
            color:#333;
            font-size:14px;
        }
    </style>
</head>

<body>

<h2>Local Video Player</h2>

<input
    type="file"
    id="videoFile"
    accept="video/*">

<button onclick="loadVideo()">Load Video</button>

<div class="message" id="message"></div>

<div class="file-name" id="fileName"></div>

<div class="player">
    <video
        id="videoPlayer"
        controls
        playsinline
        preload="metadata">

        Your browser does not support HTML5 video.

    </video>
</div>

<script>

let currentVideoURL = null;

function loadVideo(){

    const fileInput = document.getElementById("videoFile");
    const video = document.getElementById("videoPlayer");
    const message = document.getElementById("message");
    const fileName = document.getElementById("fileName");

    message.textContent = "";
    fileName.textContent = "";

    // Check if a file was selected
    if(!fileInput.files || fileInput.files.length === 0){

        message.style.color = "red";
        message.textContent = "Please select a video file.";

        return;
    }

    const file = fileInput.files[0];

    // Check whether the selected file is a video
    if(!file.type.startsWith("video/")){

        message.style.color = "red";
        message.textContent = "Please select a valid video file.";

        return;
    }

    // Remove previous video URL
    if(currentVideoURL){

        URL.revokeObjectURL(currentVideoURL);

    }

    // Create temporary local URL
    currentVideoURL = URL.createObjectURL(file);

    // Load video
    video.src = currentVideoURL;

    video.load();

    // Display file name
    fileName.textContent = "Selected file: " + file.name;

    message.style.color = "green";
    message.textContent = "Video loaded successfully.";

    // Try to start playback
    video.play().catch(function(){

        // Browser may block autoplay.
        // User can press the Play button.
        
    });

}


// Automatically load video when a file is selected
document.getElementById("videoFile").addEventListener("change", function(){

    if(this.files.length > 0){

        loadVideo();

    }

});

</script>

</body>
</html>
